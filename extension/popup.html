<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>Liorvix 自动网申</title>
    <style>
      body { width: 380px; margin: 0; font: 14px/1.5 system-ui, sans-serif; background: #fff; color: #111; }
      header { padding: 14px 16px; border-bottom: 1px solid #eee; }
      h1 { margin: 0; font-size: 16px; }
      p { margin: 4px 0 0; color: #666; font-size: 12px; }
      main { padding: 12px 16px; max-height: 480px; overflow: auto; }
      button { border: 0; border-radius: 8px; padding: 8px 12px; cursor: pointer; font-size: 13px; }
      .primary { background: #111; color: #fff; }
      .ghost { background: #f4f4f5; color: #333; }
      .row { display: flex; gap: 8px; margin: 10px 0; }
      .field { border: 1px solid #eee; border-radius: 8px; padding: 8px 10px; margin-bottom: 8px; }
      .field label { display: flex; gap: 8px; align-items: flex-start; }
      .meta { color: #888; font-size: 11px; margin-top: 4px; }
      .value { color: #333; font-size: 12px; margin-top: 4px; word-break: break-word; }
      .badge { display: inline-block; border-radius: 999px; padding: 2px 8px; font-size: 11px; background: #f4f4f5; }
      .ai { background: #fff7ed; color: #c2410c; }
      .resume { background: #ecfdf5; color: #047857; }
      .empty { background: #f4f4f5; color: #666; }
      footer { padding: 10px 16px; border-top: 1px solid #eee; color: #888; font-size: 11px; }
      .error { color: #dc2626; margin-top: 8px; font-size: 12px; white-space: pre-wrap; }
      .muted { color: #888; }
      a { color: #111; }
    </style>
  </head>
  <body>
    <header>
      <h1>Liorvix 自动网申</h1>
      <p>只填不提交 · 提交前请逐项确认</p>
    </header>
    <main>
      <div class="row">
        <button id="open-liorvix" class="ghost">打开 Liorvix</button>
        <button id="scan" class="primary">扫描表单</button>
        <button id="fill" class="primary">填写已确认字段</button>
        <button id="mark-submitted" class="ghost">标记已投递</button>
      </div>
      <div id="status" class="muted">正在读取状态...</div>
      <div id="error" class="error"></div>
      <div id="fields"></div>
    </main>
    <footer>不会自动点击提交按钮；文件上传字段需要手动选择。</footer>
    <script src="popup.js"></script>
  </body>
</html>
