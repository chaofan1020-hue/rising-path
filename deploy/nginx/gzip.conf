# Liorvix nginx gzip 片段（P1 第 5 项，带宽优化）
#
# 现状：生产 nginx 的 gzip 配置被注释掉，`/api/jobs` 一次 194 KB 明文 JSON，
# 手机端/慢网被放大 5–8 倍。这个片段把 JSON 也纳入压缩。
#
# 用法（二选一）：
#   A. 追加到 /etc/nginx/nginx.conf 的 http{} 块末尾
#   B. 放到 /etc/nginx/conf.d/liorvix-gzip.conf（conf.d 在 http{} 内被 include）
#
# 应用步骤：
#   sudo cp deploy/nginx/gzip.conf /etc/nginx/conf.d/liorvix-gzip.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# 回滚：删掉该文件，再 `nginx -t && systemctl reload nginx`（无状态，零风险）。
#
# 验证：
#   curl -sS -o /dev/null -D - -H 'Accept-Encoding: gzip' \
#     'https://liorvix.com/api/jobs?limit=50' | grep -i -E 'content-encoding|content-length'
#   期望：content-encoding: gzip，content-length 明显小于未压缩时的值。
#   （注意：若前置 Cloudflare 已压缩，这里看到的可能是 CF 的结果；
#     要么临时绕过 CF 直连源站验证，要么看 nginx access log 的 $body_bytes_sent。）

# 注意：生产 /etc/nginx/nginx.conf 第 46 行已经有 `gzip on;`，这里**不能再写一遍**，
# 否则 `nginx -t` 报 `"gzip" directive is duplicate`（VPS 实测，整站点 reload 会被挡住）。
# 本片段只补 gzip on 缺失的那些参数。
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
# 小于 1 KB 的响应压缩收益低于握手成本
gzip_min_length 1024;
gzip_types
  application/json
  application/javascript
  application/manifest+json
  application/xml
  application/rss+xml
  image/svg+xml
  text/css
  text/javascript
  text/plain
  text/xml;
# SSE / 流式响应不要压缩（模拟面试的 /api/interview/chat 是流式）
gzip_disable "msie6";