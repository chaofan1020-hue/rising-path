# 预检（OPTIONS）专用 CORS 片段 —— 在 location 里 include。
#
# 为什么需要：GoTrue 对真实请求回 `Access-Control-Allow-Origin: *`，但对 OPTIONS
# 只回 204、不带 CORS 头，浏览器会直接判跨域失败（VPS 实测，smoke-test 第 7 项）。
# Cloud 上这一步由 Kong 网关代劳；自托管没有网关，只能在 nginx 补。
# 只处理 OPTIONS，真实响应仍由各服务自己发头，因此不会出现重复 ACAO。
#
# 注意：`add_header` 不能写在 server 级的 if 里（nginx 报 "directive is not allowed here"），
# 必须放在 location 内的 if 里，所以做成片段被三个 location 各 include 一次。
if ($request_method = OPTIONS) {
  add_header Access-Control-Allow-Origin '*' always;
  add_header Access-Control-Allow-Methods 'GET,HEAD,PUT,PATCH,POST,DELETE,OPTIONS' always;
  add_header Access-Control-Allow-Headers 'authorization,x-client-info,apikey,content-type,x-supabase-api-version,x-supabase-client-platform,x-supabase-client-platform-version,x-supabase-client-runtime,x-supabase-client-runtime-version,prefer,accept-profile,content-profile,range,x-upsert,x-skip-authorization' always;
  add_header Access-Control-Max-Age 3600 always;
  add_header Content-Length 0;
  return 204;
}