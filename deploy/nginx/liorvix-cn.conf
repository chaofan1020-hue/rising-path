server {
  server_name liorvix.cn www.liorvix.cn _;

  root /www/wwwroot/liorvix-cn;
  index index.html;

  charset utf-8;
  client_max_body_size 8m;

  location / {
    try_files $uri $uri/ =404;
  }

  location = /healthz {
    default_type text/plain;
    return 200 "ok\n";
  }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/liorvix.cn/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/liorvix.cn/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.liorvix.cn) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = liorvix.cn) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


  listen 80 default_server;
  listen [::]:80 default_server;
  server_name liorvix.cn www.liorvix.cn _;
    return 404; # managed by Certbot




}
