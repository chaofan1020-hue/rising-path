# supabase.liorvix.com —— 自托管 Supabase 的对外入口（P2）
#
# 与官方 compose 的差异：不用 Envoy/Kong 网关，由 nginx 按路径把三个服务拼到同一个域名下，
# 这样应用只需要一个 SUPABASE_URL（https://supabase.liorvix.com），与 Cloud 的路径语义完全一致：
#   /auth/v1/*    -> 127.0.0.1:9999   (GoTrue，剥掉 /auth/v1 前缀)
#   /rest/v1/*    -> 127.0.0.1:3000   (PostgREST，剥掉 /rest/v1 前缀)
#   /storage/v1/* -> 127.0.0.1:5100   (storage-api，剥掉 /storage/v1 前缀)
#
# 部署：cp 到 /etc/nginx/sites-available/supabase.liorvix.com.conf
#       ln -s 到 sites-enabled，然后 certbot --nginx -d supabase.liorvix.com
# 应用这一层之前先 `nginx -t`，失败即回滚（只删这个 symlink 即可）。

server {
  listen 80;
  listen [::]:80;
  server_name supabase.liorvix.com;

  # 简历 PDF / 头像上传；与 storage 的 FILE_SIZE_LIMIT=52428800 对齐
  client_max_body_size 50m;

  # PostgREST 会把完整请求 URI 回显进 Content-Location 响应头。岗位同步/官方字段任务
  # 会拼出 4–6 KB 的 `source_system=in.(...)` 查询，响应头超过 nginx 默认
  # proxy_buffer_size（4 KB）就报 "upstream sent too big header" → 502（VPS 实测：
  # 4 KB 起 502、8 KB 起 414）。生产走 Cloud（Cloudflare + Kong 缓冲更大）看不出来，
  # 自托管必须放大，否则切流后岗位同步/官方字段回填会整条链路失败。
  proxy_buffer_size 32k;
  proxy_buffers 8 32k;
  proxy_busy_buffers_size 64k;
  # 请求行同理：长 URI 超过 large_client_header_buffers（默认 4×8KB）会 414。
  client_header_buffer_size 8k;
  large_client_header_buffers 4 32k;

  # 这一层不做 CORS：GoTrue / PostgREST / storage 自己会回 Access-Control-Allow-*，
  # nginx 再加一遍会导致重复头，浏览器直接报错。只做透明转发。
  #
  # 唯一例外是 **OPTIONS 预检**（见 supabase-cors-preflight.conf 的注释）：
  # 三个 location 各 include 一次，只补预检、不碰真实响应。

  access_log /var/log/nginx/supabase.access.log;
  error_log  /var/log/nginx/supabase.error.log;

  location = /auth/v1 {
    return 308 /auth/v1/;
  }

  location /auth/v1/ {
    include /etc/nginx/snippets/supabase-cors-preflight.conf;
    proxy_pass http://127.0.0.1:9999/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
  }

  location = /rest/v1 {
    return 308 /rest/v1/;
  }

  location /rest/v1/ {
    include /etc/nginx/snippets/supabase-cors-preflight.conf;
    proxy_pass http://127.0.0.1:3000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # 岗位列表 / AI 选岗在流量高峰可能出现 2–3 秒的慢查询，留足余量
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
  }

  location = /storage/v1 {
    return 308 /storage/v1/;
  }

  location /storage/v1/ {
    include /etc/nginx/snippets/supabase-cors-preflight.conf;
    proxy_pass http://127.0.0.1:5100/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # storage 开了 REQUEST_ALLOW_X_FORWARDED_PATH，靠这个头把"被剥掉的 /storage/v1 前缀"
    # 还原回去，否则它生成的 publicUrl / 签名 URL 会缺前缀（上传成功但访问 404）。
    proxy_set_header X-Forwarded-Path $request_uri;
    # 大文件直接流给客户端，不在 nginx 落临时文件
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
  }

  # GoTrue 邮件模板（只读静态文件）。
  # ⚠️ GoTrue v2.197 的 MAILER_TEMPLATES_* 只认 **URL**：传本地路径时它会把路径拼到
  #    SiteURL 之后（https://liorvix.com/etc/...）→ 发信 500（VPS 实测）。
  #    所以模板正文放 /opt/supabase/templates，由这里暴露成 https URL 给 auth 容器拉取。
  location /auth-templates/ {
    alias /opt/supabase/templates/;
    types { }
    default_type text/html;
    add_header Cache-Control "no-store" always;
    access_log off;
  }

  # 健康检查（给 smoke 脚本和 uptime 探针用，不暴露内部端口）
  location = /healthz {
    proxy_pass http://127.0.0.1:9999/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    access_log off;
  }
}
