<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>验证你的邮箱 · Liorvix</title>
</head>
<body style="margin:0;padding:0;background:#f5f5f4;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;color:#1c1917;">
  <div style="display:none;max-height:0;overflow:hidden;">24 小时内有效 · 完成邮箱验证即可开始使用 Liorvix</div>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f5f5f4;padding:32px 12px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#ffffff;border-radius:16px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.06);">
          <tr>
            <td style="padding:28px 32px 8px 32px;">
              <div style="font-size:18px;font-weight:700;letter-spacing:.02em;">Liorvix</div>
              <div style="font-size:12px;color:#78716c;margin-top:4px;">海外留学生一站式求职平台</div>
            </td>
          </tr>
          <tr>
            <td style="padding:16px 32px 0 32px;">
              <h1 style="margin:0 0 12px 0;font-size:20px;line-height:1.4;">验证你的邮箱</h1>
              <p style="margin:0 0 20px 0;font-size:14px;line-height:1.7;color:#44403c;">
                感谢注册 Liorvix。点击下面的按钮完成邮箱验证，就可以开始上传简历、使用 AI 选岗和简历优化了。
              </p>
            </td>
          </tr>
          <tr>
            <td align="center" style="padding:0 32px;">
              <a href="{{ .ConfirmationURL }}"
                 style="display:inline-block;padding:13px 28px;background:#1c1917;color:#ffffff;text-decoration:none;border-radius:10px;font-size:14px;font-weight:600;">
                完成验证
              </a>
            </td>
          </tr>
          <tr>
            <td style="padding:22px 32px 0 32px;">
              <p style="margin:0 0 8px 0;font-size:12px;line-height:1.6;color:#78716c;">
                按钮无法点击？把下面这个链接复制到浏览器打开：
              </p>
              <p style="margin:0 0 20px 0;font-size:12px;line-height:1.6;word-break:break-all;">
                <a href="{{ .ConfirmationURL }}" style="color:#2563eb;">{{ .ConfirmationURL }}</a>
              </p>
            </td>
          </tr>
          <tr>
            <td style="padding:0 32px 28px 32px;">
              <div style="border-top:1px solid #e7e5e4;padding-top:16px;font-size:12px;line-height:1.7;color:#a8a29e;">
                这封邮件由系统自动发送，请勿直接回复。如果你没有注册 Liorvix，忽略本邮件即可，账号不会被创建。<br>
                链接 24 小时内有效。
              </div>
            </td>
          </tr>
        </table>
        <div style="max-width:560px;margin:16px auto 0 auto;font-size:11px;color:#a8a29e;text-align:center;">
          © Liorvix · liorvix.com
        </div>
      </td>
    </tr>
  </table>
</body>
</html>
